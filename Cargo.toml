[workspace]
members = [
    "crates/ijevim-core",
    "crates/ijevim-highlight",
    "crates/ijevim-plugin",
    "crates/ijevim-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A minimal Vim-like TUI editor written in Rust"
authors = ["NazoVim-org"]
license = "MIT"
repository = "https://github.com/ijevim-org/ijevim"

[workspace.dependencies]
# Internal crates.
ijevim-core = { path = "crates/ijevim-core" }
ijevim-highlight = { path = "crates/ijevim-highlight" }
ijevim-plugin = { path = "crates/ijevim-plugin" }
ijevim-tui = { path = "crates/ijevim-tui" }

# External crates shared across the workspace.
crossterm = "0.29"
ropey = "1.6"
# 1.53.3 is the first release of this series that fixes RUSTSEC-2026-0386
# (`AsyncFd::new` I/O safety). 1.54+ raises the MSRV to 1.85, above ours.
tokio = ">=1.53.3, <1.54"
thiserror = "2"
toml = "0.8"
regex = "1"
unicode-width = "0.2"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "default-syntaxes", "default-themes"] }
mlua = { version = "0.9", features = ["lua54", "vendored"] }
rust_lisp = "0.18"
quickjs-rusty = "0.11"
libloading = "0.8"
serde_json = "1"

[package]
name = "ijevim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ijevim"
path = "src/main.rs"

[features]
# No features are enabled by default. The bare editor (TUI + buffer + keymap +
# undo + basic commands) works without any of them.
default = []

# Syntax highlighting via syntect.
syntax = ["ijevim-highlight/syntax", "ijevim-tui/syntax"]

# Per-language plugin loaders. Each one pulls in a heavy runtime; enable only
# the ones you actually need.
plugin-lua = ["ijevim-plugin/plugin-lua"]
plugin-lisp = ["ijevim-plugin/plugin-lisp"]
plugin-js = ["ijevim-plugin/plugin-js"]
plugin-rust = ["ijevim-plugin/plugin-rust"]
plugin-nix = ["ijevim-plugin/plugin-nix"]

# Convenience aggregates.
plugins = ["plugin-lua", "plugin-lisp", "plugin-js", "plugin-rust", "plugin-nix"]
full = ["syntax", "plugins"]

[dependencies]
# Workspace crates.
ijevim-core.workspace = true
ijevim-highlight.workspace = true
ijevim-plugin.workspace = true
ijevim-tui.workspace = true

# Application-layer dependencies.
crossterm.workspace = true
# The editor runs on a single thread with `#[tokio::main]` + `#[tokio::test]`,
# so only `rt` and `macros` are needed here; `fs` is pulled in by ijevim-core.
tokio = { workspace = true, features = ["rt", "macros"] }
regex.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[[bench]]
name = "editor_bench"
harness = false

# ── Packaging metadata (used by cargo-deb, cargo-generate-rpm, etc.) ──

[package.metadata.deb]
maintainer = "NazoVim-org <https://github.com/NazoVim-org/ijevim>"
depends = ""
extended-description = "A minimal Vim-like TUI editor written in Rust."
section = "editors"
priority = "optional"
assets = [
    ["target/release/ijevim", "usr/bin/", "755"],
    ["pkg/ijevim.desktop", "usr/share/applications/", "644"],
    ["pkg/ijevim.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/ijevim", dest = "/usr/bin/", mode = "755" },
    { source = "pkg/ijevim.desktop", dest = "/usr/share/applications/", mode = "644" },
    { source = "pkg/ijevim.svg", dest = "/usr/share/icons/hicolor/scalable/apps/", mode = "644" },
]

[profile.dev]
# Line tables only — no full debug info. Saves ~30% compile time.
debug = 1
# Ensure incremental compilation is on (default, but be explicit).
incremental = true
# Keep codegen-units high for parallel backend work (default).
codegen-units = 256

[profile.release]
lto = true
codegen-units = 1
